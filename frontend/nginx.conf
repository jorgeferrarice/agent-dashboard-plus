server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate index.html so browsers pick up new builds.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Proxy backend routes so frontend and API share one origin.
    # Keep this list in sync with the routes in backend/app/main.py
    # (backend/tests/test_main.py checks it).
    location ~ ^/(login|auth|logout|me|hosts|agents|tasks|health|version|socket\.io)(/|$) {
        proxy_pass http://backend:8000;
        # Files dropped on a terminal: MAX_UPLOAD_BYTES in
        # backend/app/main.py plus multipart overhead.
        client_max_body_size 95m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1d;
    }
}
