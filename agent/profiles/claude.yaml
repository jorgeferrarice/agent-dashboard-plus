# Claude Code agent profile
name: claude
display_name: Claude
color: purple
binary: claude

commands:
  new: ["claude"]
  resume: ["bash", "-c", "claude --continue || claude"]

env:
  CLAUDE_CODE_ENABLE_TELEMETRY: "1"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "otlp"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/json"
  # Send log events every second instead of every 5: they
  # carry session.id, which the chat view needs to find the
  # conversation (see "chat" below).
  OTEL_LOGS_EXPORT_INTERVAL: "1000"

# Chat view: the dashboard shows the conversation as web
# messages by reading Claude's own transcript
# (<config dir>/projects/<folder>/<session id>.jsonl). See
# docs/chat.md.
chat: claude

# No auth gate — Claude Code supports API key, OAuth,
# and Vertex AI. The daemon can't detect all auth
# methods (OAuth stores credentials in ~/.claude/),
# so binary presence is sufficient. If the user isn't
# authenticated, Claude will prompt at startup.

# Accounts. Every ~/.claude* directory holding a signed-in
# account is offered as its own tool, started with
# CLAUDE_CONFIG_DIR pointing at it (~/.claude-work becomes
# "claude-work"). ~/.claude is this profile itself. Claude
# keeps the account in .claude.json: inside the directory,
# or in the home directory for the default one.
config_dirs:
  env: CLAUDE_CONFIG_DIR
  glob: "~/.claude*"
  default: "~/.claude"
  login_file: .claude.json
  default_login_file: "~/.claude.json"
  login_key: oauthAccount
  # Sessions started as the old hand-written profile.
  aliases:
    claude-infinitum: claude-infinite

# Plan limits. The daemon opens Claude in an empty folder of
# its own, types /usage and reads the screen (see
# agent/usage_probe.py). The first time, Claude asks whether
# the folder is trusted, with "No, exit" selected.
usage:
  parser: claude
  keys: /usage
  prompts:
    - match: "Yes, I trust this folder"
      keys: ["Down", "Enter"]

mcp:
  project_file: .mcp.json
  user_files:
    - ~/.claude.json

telemetry:
  token_metrics:
    - claude_code.token.usage
  cost_metric: claude_code.cost.usage
  activity_metrics:
    - claude_code.tool.execution
    - claude_code.tool
  runtime_metric:
    name: claude_code.active_time.total
    unit: seconds

permission_patterns:
  # No "\\u2610" (☐): it also marks the items of Claude's to-do
  # lists. Questions show a numbered menu, matched below.
  - "Do you want to proceed"
  - "\\u276f\\s+\\d+\\."
  - "Skip interview and plan"

# Build-time provisioning metadata
provisioning:
  install:
    npm:
      - "@anthropic-ai/claude-code"
  config_files:
    - path: "/root/.claude"
      mkdir: true
  verify: "claude --version"
  mounts:
    - host: "~/.claude"
      container: "/root/.claude"
      mode: rw
    - host: "~/.claude.json"
      container: "/root/.claude.json"
      mode: ro
    - host: "~/.config/gcloud"
      container: "/root/.config/gcloud"
      mode: ro
  passthrough_env:
    - ANTHROPIC_API_KEY
    - CLAUDE_CODE_USE_VERTEX
    - CLOUD_ML_REGION
    - ANTHROPIC_VERTEX_PROJECT_ID
